# Unsigned smoke builds for PRs and pushes.
name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

env:
  NODE_OPTIONS: "--max-old-space-size=4096"
  WAILS_VERSION: v2.12.0
  GO_VERSION: "1.25.x"

jobs:
  build:
    name: Build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-amd64
            platform: windows/amd64
            nsis: true
          - os: macos-latest
            label: darwin-universal
            platform: darwin/universal
            nsis: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install NSIS
        if: matrix.nsis
        shell: pwsh
        run: |
          choco install nsis -y
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        env:
          CGO_ENABLED: ${{ matrix.os == 'macos-latest' && '1' || '0' }}
        run: |
          if [ "${{ matrix.nsis }}" = "true" ]; then
            wails build -platform ${{ matrix.platform }} -nsis -clean
          else
            wails build -platform ${{ matrix.platform }} -clean
          fi
        shell: bash

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: draft-${{ matrix.label }}
          retention-days: 7
          path: |
            build/bin/Draft.exe
            build/bin/Draft-*-installer.exe
            build/bin/Draft.app
